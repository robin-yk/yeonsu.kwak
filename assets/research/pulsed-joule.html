<div class=card><div class=row>
<div class=txt><h3>Pulsed Joule CH&#8324; + CO&#8322;</h3><p>Tandem non-oxidative coupling of methane and carbon dioxide reduction via pulsed Joule thermochemistry</p><p class=meta><i>ACS Energy Letters</i> 2025</p><p class=cov><i>Supplementary cover art</i></p></div>

 [S(G2,D.bz.CH,bsx,bsy,G,'furnace'),S(G2,D.bz.CJH,bsx,bsy,G,'continuous','4 3'),S(G2,D.bz.RPH,bsx,bsy,A,'pulsed Joule',0,2.2)],
 [S(G3,D.rt.H2only,rsx,rsy,G,'H₂, CH₄ only','4 3'),S(G3,D.rt.H2mix,rsx,rsy,A,'H₂',0,2.2),S(G3,D.rt.CO,rsx,rsy,'#5b7bb8','CO'),S(G3,D.rt.H2O,rsx,rsy,'#9fb3d9','H₂O')]];

const GG=[G0,G1,G2,G3];let cur='';
const PW1=1.006,PWv=[[0,535],[0.05,1050],[0.125,837],[0.175,794],[0.225,741],[0.275,705],[0.325,673],[0.375,641],[0.425,616],[0.475,591],[0.525,580],[0.575,566],[0.625,552],[0.8,540],[1.006,535]];const Tp=t=>{const ph=((t%PW1)+PW1)%PW1;for(let i=0;i<PWv.length-1;i++){const a=PWv[i],b=PWv[i+1];if(ph<=b[0])return a[1]+(b[1]-a[1])*(ph-a[0])/(b[0]-a[0])}return 535};

 if(!cap.textContent){cur=c[2];cap.textContent=cur}if(c[2]!==cur){cur=c[2];cap.style.opacity=0;setTimeout(()=>{cap.textContent=cur;cap.style.opacity=1},150)}

 if(k==0){const te=Math.min(4,T);let d='';for(let i=0;i<=400;i++){const t=i/100;if(t>te)break;d+=(i?'L':'M')+tsx(t).toFixed(1)+' '+tsy(Tp(t)).toFixed(1)}pulse.setAttribute('d',d);pdot.setAttribute('cx',tsx(te));pdot.setAttribute('cy',tsy(Tp(te)))}

  if(isCO2){m.a.setAttribute('fill',past?'#8fa6cf':A);m.b.setAttribute('opacity',0);m.a.setAttribute('r',past?2.4:3)}
  else if(past&&j%2==0){m.a.setAttribute('fill',HOT);m.b.setAttribute('fill',HOT);m.b.setAttribute('cx',5);m.b.setAttribute('opacity',1);m.a.setAttribute('r',2.6)}

}
