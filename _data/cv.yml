    Experience:
      - company: Linde Engineering America
        position: R&D Intern
        location: Tonawanda, NY, United States
        start_date: 2026-05
        highlights:
          - Developed and validated an equilibrium-kinetic model predicting high-temperature water-gas-shift performance and hydrocarbon byproduct formation from reactor operating conditions; deployed as an interactive web solver.
          - Developed a UniSim hydrogen-plant flowsheet model and quantitative design guidance for H<sub>2</sub> recycle, reformer/shift configuration, heat integration, and carbon intensity.

      - company: University of Delaware
        position: Graduate Research Assistant
        location: Newark, DE, United States
        start_date: 2021-08
        end_date: 2026-08
        summary: "Advisor: Prof. Dionisios G. Vlachos."
        highlights:
          - Designed heterogeneous catalysts and investigated structure–property–performance relationships using operando dielectric, Raman, XRD, and catalytic measurements to understand oxygen-vacancy-mediated reactivity.
          - Developed continuous-flow microwave and conventional catalytic reactor systems for methane reforming, propane dehydrogenation, and ethane cracking.
          - Combined pulsed Joule-heating experiments with microkinetic modeling conducted in collaboration to explain enhanced methane coupling and reduced coke and aromatic byproduct formation relative to continuous heating.
          - Led experimental reactor development and collaborated with CFD researchers to design an internally Joule-heated ethane cracker with enhanced ethylene yield and projected reductions in capital requirements and CO<sub>2</sub> emissions.
          - Synthesized PtSn/SiO<sub>2</sub> catalysts and demonstrated coke-resistant microwave propane dehydrogenation (PDH) without H<sub>2</sub> co-feed, with higher energy efficiency and slower nanoparticle sintering than furnace heating.

      - company: ITACA Institute, Universitat Politècnica de València
        position: Visiting Scholar
        location: Valencia, Spain
        start_date: 2024-06
        end_date: 2024-06
        summary: "Host: Prof. José M. Catalá-Civera."
        highlights:
          - Developed perturbation-based dual-mode cavity protocols to quantify microwave heating profiles and dielectric properties for operando catalysis studies.
          - Coordinated ITACA–UD dual-mode cavity co-development, international shipment and customs, and preparation for XAS-compatible microwave experiments at QAS, BNL.

      - company: INMA Institute, University of Zaragoza
        position: Visiting Scholar
        location: Zaragoza, Spain
        start_date: 2022-11
        end_date: 2022-11
        summary: "Host: Prof. Jesús Santamaría."
        highlights:
          - Conducted cross-laboratory experiments to verify the reproducibility of microwave-assisted PDH performance.

      - company: Korea Institute of Science and Technology (KIST)
        position: Research Scientist (Alternative Military Service)
        location: Seoul, South Korea
        start_date: 2019-11
        end_date: 2021-08
        highlights:
          - Advanced LOHC dehydrogenation systems from catalyst benchmarking to low-platinum-loading catalyst development via atomic layer deposition for scalable hydrogen release.
          - Designed and constructed Ni-alloy foam architectures for Joule-heated ammonia decomposition reactors.
          - Scaled an LOHC dehydrogenation reactor to 2.3 Nm<sup>3</sup> h<sup>-1</sup> H<sub>2</sub> production using phase-change thermal management.
          - Managed multi-year projects funded by Hyundai Motor Company and the National Research Foundation of Korea.

      - company: Institute for Advanced Engineering (IAE)
        position: Research Engineer (Alternative Military Service)
        location: Yongin, South Korea
        start_date: 2017-08
        end_date: 2019-11
        highlights:
          - Scaled a continuous 5 ton yr<sup>-1</sup> sustainable aviation fuel pilot process integrating palm-oil deoxygenation, hydrocracking, isomerization, and distillation to produce jet-fuel-range hydrocarbons meeting ASTM D7566.
          - Managed continuous pilot operations, rotating shift schedules, and process-safety procedures.

      - company: Texas A&M University
        position: Graduate Research Assistant
        location: College Station, TX, United States
        start_date: 2016-09
        end_date: 2017-08
        summary: "Advisors: Profs. Hae-Kwon Jeong & Phanourios Tamamis."
        highlights:
          - Synthesized CO<sub>2</sub>-capturing amyloid biomaterials via peptide self-assembly and validated CO<sub>2</sub> uptake.

