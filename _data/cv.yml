cv:
  name: Yeonsu Kwak
  label: Ph.D. Candidate in Chemical & Biomolecular Engineering
  email: fiske@udel.edu
  location: Newark, DE
  image: ""
  summary: >
    Process and reaction engineer working on the design, modeling and scale-up of continuous thermal systems,
    from heat transfer and reactor design to kinetics, flowsheet simulation and techno-economics. I have taken
    systems from bench rigs to a continuous 5 ton/yr pilot plant, and I build the models and solvers that
    support design decisions. My domains so far are hydrogen carriers, sustainable fuels, and the
    electrification of chemical manufacturing.

